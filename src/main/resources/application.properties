spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=local

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://xrornjnoqpukkiatqtmh.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://xrornjnoqpukkiatqtmh.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

server.port=${PORT:8080}